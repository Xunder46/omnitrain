name: omnitrain_watch_link
description: OmniTrain's phone-side link to the Apple Watch over WatchConnectivity (iOS only). Replaces the watch_connectivity package with a link that queues, buffers, acknowledges and reports reachability.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: OmniTrainWatchLinkPlugin
