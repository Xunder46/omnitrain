name: omnitrain_watch_link
description: OmniTrain's link to the wrist over both platforms' own APIs — WatchConnectivity on iOS, the Wear OS data layer on Android. Replaces the watch_connectivity package with a link that queues, buffers, acknowledges and reports reachability.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: OmniTrainWatchLinkPlugin
      android:
        package: dev.sasha.omnitrain.watch_link
        pluginClass: OmniTrainWatchLinkPlugin
