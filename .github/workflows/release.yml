name: Release build
on:
  workflow_dispatch:    # you click "Run workflow" from the Actions tab

jobs:
  ios:
    runs-on: macos-14
    # Job-level Sentry env. Declared ONCE per job so every step (build and
    # symbol upload) inherits the same values. Repeating these per-step
    # would mean a job could keep a stale SENTRY_PROJECT in one step while
    # another was corrected — the pre-release gate's §11o check reads this
    # block as the single source of truth for the job's upload destination.
    #
    # SENTRY_DSN is the only value that reaches the app binary, and only
    # via the explicit --dart-define in the build step. The token, org, and
    # project are build-machine-only and must never be --dart-define'd.
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: omnitrain
    steps:
    - uses: actions/checkout@v4

    # Import the signing cert into a temporary keychain so Xcode can sign.
    - name: Import signing certificate
      env:
        CERT_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
        CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASS: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      run: |
        KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
        security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
        echo "$CERT_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
        security import $RUNNER_TEMP/cert.p12 \
          -P "$CERT_PASS" \
          -A -t cert -f pkcs12 \
          -k "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 -u "$KEYCHAIN_PATH"

    # Drop the provisioning profile where Xcode expects it.
    - name: Install provisioning profile
      env:
        PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
      run: |
        PROFILE_DIR=$HOME/Library/MobileDevice/Provisioning\ Profiles
        mkdir -p "$PROFILE_DIR"
        echo "$PROFILE" | base64 --decode > "$PROFILE_DIR/build.mobileprovision"

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'

    - run: flutter pub get
    - run: pod install --project-directory=ios

    # The iOS build uses `flutter build ipa` (the tooling-driven
    # build) rather than calling `xcodebuild` directly. `flutter
    # build ipa` invokes xcodebuild internally with the arguments
    # Flutter knows to be correct, including forwarding
    # `--dart-define=SENTRY_DSN=$SENTRY_DSN` to the Dart front-end
    # via `--ExtraFrontEndOptions`. The previous bespoke xcodebuild
    # invocation relied on `EXTRA_FRONT_END_OPTIONS` to inject the
    # DSN; the gate (§11p) now requires `flutter build ipa` so the
    # DSN-forwarding path is the standard, end-to-end one. Signing
    # and archiving continue to work — `ExportOptions.plist` and
    # the imported certificate in the temporary keychain are both
    # honoured by `flutter build ipa`.
    #
    # The cert-import and provisioning-profile steps above remain
    # because the GitHub-Actions keychain is temporary; the
    # certificate is not at the standard keychain location, so
    # `flutter build ipa` would otherwise fail to resolve the
    # signing identity. The cert is available to `flutter build
    # ipa` from the temporary keychain we created above.
    - name: Build IPA with Sentry baked in
      env:
        FLUTTER_BUILD_MODE: release
      run: |
        # `--export-options-plist` tells `flutter build ipa` how to
        # archive and export the build for distribution. `flutter
        # build ipa` invokes xcodebuild internally and resolves
        # signing from the keychain.
        # `--dart-define=SENTRY_DSN=$SENTRY_DSN` is forwarded to the
        # Dart front-end so the Sentry SDK initialises against the
        # real DSN at runtime.
        #
        # Deliberately NOT using `--split-debug-info`/`--obfuscate`.
        # Both strip Dart symbol names out of the binary, which would
        # make readable Dart stack traces depend on the upload step
        # below succeeding. Today Dart traces symbolicate with no
        # upload at all; that unconditional guarantee is worth more
        # than the binary-size saving. Revisit once symbol upload has
        # a few green releases behind it.
        flutter build ipa \
          --release \
          --export-options-plist=ios/ExportOptions.plist \
          --dart-define=SENTRY_DSN=$SENTRY_DSN
        ls build/ios/ipa

    # Symbol upload is a SEPARATE step. `sentry_dart_plugin` is a Dart
    # CLI — it installs no Xcode build phase and no Gradle task, so the
    # build alone uploads nothing. This step is what makes iOS crash
    # reports symbolicate.
    - name: Upload iOS debug symbols to Sentry
      run: dart run sentry_dart_plugin

    - uses: actions/upload-artifact@v4
      with:
        name: ipa
        path: build/ios/ipa/*.ipa

  android:
    runs-on: ubuntu-latest
    # Android build runs in parallel with iOS (separate runner).
    # Same three secrets are reused. There is a single Sentry
    # project named `omnitrain`; both platforms upload to it.
    #
    # Job-level env, declared once — see the note on the iOS job.
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: omnitrain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
      - run: flutter pub get
      - name: Build AAB with Sentry baked in
        run: |
          # Only SENTRY_DSN is passed to the Flutter build as a
          # --dart-define. SENTRY_AUTH_TOKEN, SENTRY_ORG, and
          # SENTRY_PROJECT are build-machine secrets consumed by the
          # symbol-upload step below; they must never be compiled
          # into the shipped Android application binary.
          #
          # As on iOS, deliberately NOT using `--split-debug-info` /
          # `--obfuscate`: keeping Dart symbols in the binary means Dart
          # stack traces stay readable even if symbol upload fails.
          flutter build appbundle --release \
            --dart-define=SENTRY_DSN=$SENTRY_DSN

      # As on iOS, symbol upload is its own step — `sentry_dart_plugin`
      # is a CLI, not a Gradle plugin, so the build does not upload
      # anything on its own.
      #
      # This uploads Dart and native (.so) symbols. It does NOT upload
      # the R8 `mapping.txt`; that needs the `io.sentry.android.gradle`
      # plugin, which is not applied yet. JVM frames therefore arrive
      # obfuscated — tracked as a follow-up.
      - name: Upload Android debug symbols to Sentry
        run: dart run sentry_dart_plugin

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: build/app/outputs/bundle/release/app-release.aab