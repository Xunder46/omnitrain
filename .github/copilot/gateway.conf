# Checks the gateway may run for Copilot agents. Generated by the installer from pipeline.config;
# edit here (or in the config, then re-run the installer).
#
#   name | timeout seconds | command | options
#
# The command is split on spaces (no shell, no quotes); arguments the agent passes are appended
# after validation (no absolute paths, no ~, no .. segments).
#
# A check named `base-setup` (optional) runs first inside the temporary checkout that `prove-red`
# makes (for example installing dependencies: `npm ci`, `flutter pub get --offline`).
#
# Options (space-separated):
#   requires-args   refuse to run with no arguments (e.g. a formatter must be given file paths,
#                   never the whole tree)
#   new-files-only  refuse any path git already tracks. Use it on formatters while the repo is not
#                   format-clean: formatting an existing file rewrites lines the change never touched
#                   (one run turned a 4-line edit into a 400-line diff)
#   full-output     always print the whole output. Without it, output over 200 lines or 16 KB is saved under
#                   .work/gateway/ and shown as a summary (first lines, failure-looking lines, last lines)
lint       | 300  | flutter analyze
test       | 900  | flutter test
build|900|flutter build ios --simulator --no-codesign
codegen|300|dart run build_runner build --delete-conflicting-outputs
pub-get|300|flutter pub get
format|120|dart format|requires-args new-files-only
swift-test|900|swift test --package-path watch/watchos
base-setup|300|flutter pub get --offline
