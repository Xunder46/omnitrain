name: omnitrain
description: "A multi-sport training log for lifting, cardio, sports, and more."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.2+16

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5 # for native filesystems (image storage)
  hive: ^2.2.3          # web-friendly local persistence
  hive_flutter: ^1.1.0  # Flutter integration for Hive
  shared_preferences: ^2.2.3 # For simple key-value storage
  fl_chart: 1.2.0      # dynamic charts
  uuid: ^4.0.0              # unique IDs
  path: ^1.8.4              # file paths
  image_picker: ^1.1.2
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  flutter_timezone: ^4.1.1
  app_settings: ^5.1.1
  provider: ^6.0.0
  package_info_plus: ^8.0.0 # for installed-app version + build metadata

  # Crash reporting — release builds only. Wired through
  # lib/core/services/crash_reporting_service.dart which installs
  # FlutterError.onError and PlatformDispatcher.onError when enabled.
  # Sentry's Flutter SDK is chosen over Firebase Crashlytics — see
  # `.github/agents/plans/crash-reporting-plan.md` for the rationale.
  sentry_flutter: ^9.24.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  health: ^13.3.1

  # Watch↔phone transport on iOS (wraps WCSession) and Wear OS. Confined to
  # `lib/core/platform/watch_connectivity_channel.dart` — everything else
  # depends on `WatchMessageChannel`/`WatchTransport`, so the package can be
  # swapped without touching a caller. See
  # `.github/agents/plans/2026-09-21-13-watch-integration-shipping.md` (D-1).
  watch_connectivity: ^0.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  # CLI that uploads debug symbols (iOS dSYMs, Android/native .so symbols,
  # Dart symbols) to Sentry. It is NOT a Gradle plugin and NOT an Xcode
  # build phase — it is run explicitly after the build via
  # `dart run sentry_dart_plugin`. See the `sentry:` config block at the
  # bottom of this file and the release workflow.
  #
  # Not covered by this tool: Android ProGuard/R8 `mapping.txt` upload,
  # which needs the `io.sentry.android.gradle` plugin. Until that is
  # applied, JVM stack traces from the minified Android release arrive
  # obfuscated. Dart-level traces (the large majority of Flutter crashes)
  # are unaffected.
  sentry_dart_plugin: ^2.0.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  test: ^1.26.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/data/food_catalog.json
    - assets/icon/
    - assets/images/
    - assets/sounds/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/omnitrain_logo_black.png"   # unchanged — legacy/iOS still wants one flattened image, iOS icons can't have transparency anyway
  adaptive_icon_background: "#000000"                   # confirm this matches your actual black exactly
  adaptive_icon_foreground: "assets/icon/omnitrain_logo_foreground_padded.png"
  min_sdk_android: 26

# Sentry symbol-upload config. The dev_dependency `sentry_dart_plugin`
# above reads this block at build time. The three upload-side values
# (auth_token, org, project) are intentionally env-driven so the same
# pubspec.yaml works for local builds (where the token is unset and
# the plugin is a no-op) and for CI release builds.
#
# These three values are build-machine ONLY. They must be exported
# in the release workflow's `env:` block (where the Sentry Android
# Gradle plugin and the sentry_dart_plugin iOS build phase can read
# them) and must NEVER be passed to `flutter build` as a
# `--dart-define`. Passing them as `--dart-define` compiles them
# into the shipped application binary, where they are extractable
# from any published artifact. The pre-release gate enforces this;
# see `scripts/pre_release_check.sh` §11l, §11m.
#
# Set the following in your release environment (`.xcode.env`,
# `android/local.properties`, or your CI secret store):
#   SENTRY_AUTH_TOKEN=<project token>
#   SENTRY_ORG=<your-sentry-org-slug>
#   SENTRY_PROJECT=omnitrain
#
# Both iOS dSYMs and Android ProGuard mappings upload to the single
# `omnitrain` Sentry project. Per-platform destinations
# (`omnitrain-ios` / `omnitrain-android`) do not exist and are
# rejected by the pre-release gate (§11n / §11o).
#
# The only Sentry value the application itself reads is the DSN, via
# `--dart-define=SENTRY_DSN=...` (consumed at runtime by
# `lib/main.dart` via `String.fromEnvironment('SENTRY_DSN', ...)`).
# The DSN is a public endpoint URL, not a credential.
# NOTE: the top-level key MUST be `sentry:`. The plugin reads
# `pubspec['sentry']` (see `sentry_dart_plugin/lib/src/utils/config-reader/
# config_reader.dart`). A block keyed `sentry_dart_plugin:` is silently
# ignored, which is how this config previously appeared correct while
# uploading nothing.
#
# Only keys the plugin actually understands may appear here. Unknown keys
# are dropped without warning, so `symbols_paths` (the real key is the
# singular `symbols_path`), `includes`, `excludes`, `build_mode`, and
# `buildscripts` are NOT valid and were removed.
#
# `sentry_dart_plugin` is a standalone Dart CLI, not a Gradle plugin and
# not an Xcode build phase. It must be invoked explicitly AFTER the build
# produces its symbols:
#
#     dart run sentry_dart_plugin
#
# The release workflow does exactly that in both jobs — see
# `.github/workflows/release.yml`.
sentry:
  upload_debug_symbols: true
  upload_sources: true
  url: https://sentry.io/
  wait_for_processing: false
  # `project`, `org`, and `auth_token` are intentionally absent: the
  # plugin reads SENTRY_PROJECT / SENTRY_ORG / SENTRY_AUTH_TOKEN from the
  # environment. That keeps the token out of the repo and lets a local
  # build (where the vars are unset) no-op instead of failing.